name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      # MinGW provides windres, which embeds the icon and version block.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - uses: Swatinem/rust-cache@v2
        with:
          key: gnu

      - name: Тесты
        run: cargo test --lib

      - name: Сборка
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER = "C:\msys64\ucrt64\bin\gcc.exe"
          cargo build --release --target x86_64-pc-windows-gnu

      - name: Проверка иконки и версии
        shell: pwsh
        run: |
          $vi = (Get-Item "target/x86_64-pc-windows-gnu/release/DLSSG-Manager.exe").VersionInfo
          Write-Host "FileDescription: '$($vi.FileDescription)'"
          Write-Host "FileVersion:     '$($vi.FileVersion)'"
          if (-not $vi.FileDescription) {
            throw "У exe нет ресурса: windres не сработал (иконка и версия не вшиты)"
          }

      - name: Комплект для раздачи
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-gnu/release/DLSSG-Manager.exe dist/
          Copy-Item target/x86_64-pc-windows-gnu/release/dlssgm-cli.exe dist/
          Copy-Item README.md, README.ru.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath DLSSG-Manager-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: DLSSG-Manager-windows-x64
          path: DLSSG-Manager-windows-x64.zip

      - name: Публикация релиза
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DLSSG-Manager-windows-x64.zip
          body_path: docs/release-notes.md
